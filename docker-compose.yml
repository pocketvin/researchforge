services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: researchforge
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge -d researchforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - researchforge-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      RESEARCHFORGE_DATABASE_URL: postgresql+psycopg://researchforge:researchforge@postgres:5432/researchforge
      RESEARCHFORGE_DATABASE_ENABLED: "true"
      RESEARCHFORGE_ARTIFACT_ROOT: /app/artifacts
      RESEARCHFORGE_DATA_NAMESPACE: product
      RESEARCHFORGE_DATA_ROOT: /app/data/product/packages
      RESEARCHFORGE_REASONING_MODE: ${RESEARCHFORGE_REASONING_MODE:-auto}
      RESEARCHFORGE_ROTATED_KEY_CONFIRMED: ${RESEARCHFORGE_ROTATED_KEY_CONFIRMED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - researchforge-artifacts:/app/artifacts
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "4173:80"

volumes:
  researchforge-postgres:
  researchforge-artifacts:
