services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      RESEARCHFORGE_ARTIFACT_ROOT: /app/artifacts
      RESEARCHFORGE_REASONING_MODE: ${RESEARCHFORGE_REASONING_MODE:-auto}
      RESEARCHFORGE_PROVIDER: ${RESEARCHFORGE_PROVIDER:-openai}
      RESEARCHFORGE_MODEL: ${RESEARCHFORGE_MODEL:-gpt-5.6-luna}
      RESEARCHFORGE_REASONING_EFFORT: ${RESEARCHFORGE_REASONING_EFFORT:-medium}
      RESEARCHFORGE_OPENAI_STORE: ${RESEARCHFORGE_OPENAI_STORE:-false}
      RESEARCHFORGE_BUDGET_USD: ${RESEARCHFORGE_BUDGET_USD:-20.00}
      RESEARCHFORGE_V2_RUN_BUDGET_USD: ${RESEARCHFORGE_V2_RUN_BUDGET_USD:-0.35}
      RESEARCHFORGE_SEC_USER_AGENT: ${RESEARCHFORGE_SEC_USER_AGENT:-ResearchForge/2.0 researchforge@example.com}
      RESEARCHFORGE_ROTATED_KEY_CONFIRMED: ${RESEARCHFORGE_ROTATED_KEY_CONFIRMED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEARCHFORGE_QWEN_API_KEY: ${RESEARCHFORGE_QWEN_API_KEY:-}
      RESEARCHFORGE_QWEN_BASE_URL: ${RESEARCHFORGE_QWEN_BASE_URL:-}
      RESEARCHFORGE_QWEN_MODEL: ${RESEARCHFORGE_QWEN_MODEL:-qwen-plus}
      RESEARCHFORGE_QWEN_REVIEW_MODEL: ${RESEARCHFORGE_QWEN_REVIEW_MODEL:-qwen-plus}
      RESEARCHFORGE_QWEN_FALLBACK_SYNTHESIS_MODEL: ${RESEARCHFORGE_QWEN_FALLBACK_SYNTHESIS_MODEL:-qwen3-max}
      RESEARCHFORGE_QWEN_VISION_MODEL: ${RESEARCHFORGE_QWEN_VISION_MODEL:-qwen3-vl-plus}
      RESEARCHFORGE_DEEPSEEK_API_KEY: ${RESEARCHFORGE_DEEPSEEK_API_KEY:-}
      RESEARCHFORGE_DEEPSEEK_BASE_URL: ${RESEARCHFORGE_DEEPSEEK_BASE_URL:-}
      RESEARCHFORGE_DEEPSEEK_MODEL: ${RESEARCHFORGE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      RESEARCHFORGE_KIMI_API_KEY: ${RESEARCHFORGE_KIMI_API_KEY:-}
      RESEARCHFORGE_KIMI_BASE_URL: ${RESEARCHFORGE_KIMI_BASE_URL:-}
      RESEARCHFORGE_KIMI_MODEL: ${RESEARCHFORGE_KIMI_MODEL:-kimi-k3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - researchforge-artifacts:/app/artifacts
    ports:
      - "127.0.0.1:${RESEARCHFORGE_API_PORT:-8000}:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${RESEARCHFORGE_WEB_PORT:-4173}:80"

volumes:
  researchforge-artifacts:
