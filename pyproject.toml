[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchforge"
version = "1.6.0"
description = "Auditable autonomous financial research agent for CN, US and HK public companies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "ResearchForge contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "langgraph>=0.6,<1",
  "openai>=1.100,<2",
  "pypdf==6.10.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
researchforge = "researchforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researchforge"]
