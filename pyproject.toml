[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchforge"
version = "2.0.0a1"
description = "Auditable filing-research agent over one canonical V2 runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "ResearchForge contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1.2.2,<2",
  "openai>=1.100,<2",
  "pypdf>=6.17,<7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "mcp>=2.1.1,<3",
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=4.30,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
researchforge = "researchforge.cli:main"
researchforge-mcp = "researchforge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF100"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researchforge"]
