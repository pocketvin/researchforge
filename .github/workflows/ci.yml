name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv lock --check
      - run: uv run ruff format --check src/researchforge scripts tests
      - run: uv run ruff check .
      - run: uv run mypy --strict src/researchforge
      - run: uv run pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/validate_contracts.py
      - run: uv run python scripts/export_v2_schemas.py --output-dir /tmp/researchforge-v2-schemas
      - run: diff -ru schemas/v2 /tmp/researchforge-v2-schemas

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pip-audit --local --skip-editable
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --frozen --all-groups
        working-directory: .
      - run: npm run test:e2e:live
      - run: node integrations/n8n/build-workflow.mjs --check
        working-directory: .
      - run: node --test integrations/n8n/workflow.test.mjs
        working-directory: .
      - run: node frontend/node_modules/eslint/bin/eslint.js --config integrations/n8n/eslint.config.mjs integrations/n8n
        working-directory: .

  containers:
    runs-on: ubuntu-latest
    env:
      RESEARCHFORGE_REASONING_MODE: deterministic
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python scripts/docker_smoke.py
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Import and publish V2 n8n workflow
        run: |
          docker compose -f docker-compose.yml -f integrations/n8n/compose.yml --profile n8n run --rm --no-deps n8n import:workflow --input=/files/researchforge-v2.workflow.json
          docker compose -f docker-compose.yml -f integrations/n8n/compose.yml --profile n8n run --rm --no-deps n8n publish:workflow --id=researchforgeV17
      - run: docker compose -f docker-compose.yml -f integrations/n8n/compose.yml --profile n8n up -d --no-deps --wait --wait-timeout 90 n8n
      - run: python -m scripts.n8n_smoke
      - if: always()
        run: docker compose -f docker-compose.yml -f integrations/n8n/compose.yml --profile n8n logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml -f integrations/n8n/compose.yml --profile n8n down --volumes
